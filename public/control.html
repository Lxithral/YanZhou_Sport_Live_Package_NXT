<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/yanzhou-seal.png">
  <title>烟洲体育导播台</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/control.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="/assets/yanzhou-seal.png" alt="中山市烟洲中学校徽" width="32" height="32">
      <div class="brand-copy"><h1>YanZhou Sport</h1><span>烟洲体育 · 直播导播台</span></div>
    </div>
    <div class="live-context" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span>
      <div class="live-copy"><strong id="live-event">正在载入赛事</strong><span id="live-meta">连接本机服务后显示当前画面</span></div>
    </div>
    <div class="header-actions">
      <div class="theme-switch" role="group" aria-label="界面主题">
        <button type="button" data-theme-option="auto" title="跟随系统" aria-label="跟随系统主题" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
        <button type="button" data-theme-option="light" title="浅色" aria-label="浅色主题" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-option="dark" title="深色" aria-label="深色主题" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <span id="connection" class="connection" role="status">正在连接</span>
    </div>
  </header>
  <nav class="mobile-nav" aria-label="工作区">
    <button type="button" data-action="workspace" data-key="work" aria-controls="work-panel" aria-pressed="true">选手名单</button>
    <button type="button" data-action="workspace" data-key="output" aria-controls="preview-card properties-column" aria-pressed="false">监看与输出</button>
  </nav>
  <main class="app-shell" data-workspace="work">
    <aside class="panel output-panel" id="properties-column" aria-label="画面输出">
      <div class="panel-head">
        <h2>画面输出</h2>
        <span id="layer-count" class="badge" aria-label="上屏图层数量"></span>
      </div>
      <div class="output-scroll">
        <section aria-label="上屏图层">
          <div id="module-list" class="module-list"></div>
        </section>
        <div id="layout-inspector" class="layout-inspector"></div>
      </div>
    </aside>
    <aside class="panel work-panel" id="work-panel" aria-label="选手名单">
      <div class="panel-head">
        <h2>选手名单</h2>
      </div>
      <section id="competitors" class="roster-pane" aria-label="选手名单">
        <form id="event-switch" class="event-switch">
          <label for="event-picker">选择上屏赛事</label>
          <div class="event-switch-controls">
            <select id="event-picker" disabled><option>正在载入</option></select>
            <button type="submit" id="take-event" class="button capture" disabled>切换赛事</button>
          </div>
        </form>
        <div class="prep-toolbar"><div id="roster-tools" class="roster-tools"></div></div>
        <div id="roster-editor" class="roster-editor"></div>
        <div id="roster-rows" class="roster-rows"></div>
        <div class="work-footer"><div class="pager" id="roster-pager" aria-label="名单分页"></div></div>
      </section>
    </aside>
    <section class="panel preview-card" id="preview-card" aria-labelledby="preview-title">
      <div class="preview-toolbar">
        <div class="preview-live">
          <h2 id="preview-title" class="preview-label">画面监看</h2>
        </div>
        <div class="preview-tools" role="group" aria-label="监看设置">
          <button type="button" class="button compact" data-monitor="backdrop" aria-pressed="false">深灰底</button>
          <button type="button" class="button compact" data-monitor="guides" aria-pressed="false">安全区</button>
          <button type="button" class="button compact" data-monitor="edit" aria-pressed="false">拖动图层</button>
        </div>
      </div>
      <div class="preview-stage" data-backdrop="grid">
        <div class="monitor-canvas"><iframe id="preview" title="OBS 画面预览"></iframe></div>
        <p id="monitor-status" role="status">正在连接监看</p>
      </div>
      <div class="preview-footer">
        <label class="obs-label" for="obs-url"><strong>OBS 浏览器源</strong><small>1920 × 1080 · 透明</small></label>
        <div class="obs-actions">
          <input type="url" id="obs-url" readonly>
          <button type="button" id="copy-obs" class="button compact" aria-label="复制 OBS 输出地址">复制</button>
          <a id="open-obs" class="button compact" href="/overlay.html" target="_blank" rel="noopener" aria-label="打开 OBS 输出页">打开</a>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/control.js"></script>
</body>
</html>
